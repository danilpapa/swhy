[workspace]
resolver = "3"
members = [
    "crates/swhy-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danilpapa/swhy"
publish = false

# Versions are the ones fixed in docs/TZ.md, "Архитектура и стек" -> "Зависимости".
# A dependency is added here at the stage that first uses it.
[workspace.dependencies]
swhy-core = { path = "crates/swhy-core" }
swhy-mcp = { path = "crates/swhy-mcp" }
swhy-fixtures = { path = "fixtures" }

clap = { version = "=4.6.7", features = ["derive"] }
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-io", "schemars"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "1", features = ["rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"
